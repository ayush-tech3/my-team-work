<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Support & AI Help Desk — StockCraft AI</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: {
                        headline: ["Outfit", "sans-serif"],
                        body: ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-slate-950 font-body text-slate-100 min-h-screen selection:bg-emerald-500 selection:text-slate-950 flex flex-col justify-between">

    <!-- Global Navigation -->
    <div id="navbar-mount"></div>

    <main class="pt-24 pb-20 max-w-xl mx-auto px-4 w-full">
        <div class="glass-panel p-8 rounded-3xl border-cyan-500/30 space-y-6 shadow-2xl">
            <div class="text-center space-y-2">
                <div class="w-12 h-12 rounded-2xl bg-cyan-500/20 text-cyan-400 flex items-center justify-center font-bold mx-auto">
                    <span class="material-symbols-outlined text-2xl">help</span>
                </div>
                <h1 class="text-3xl font-black font-headline text-white">StockCraft AI Help Desk</h1>
                <p class="text-xs text-slate-400">Have questions about trading, order execution, or subscription billing?</p>
            </div>

            <form onsubmit="handleSupportSubmit(event)" class="space-y-4 text-xs">
                <div>
                    <label class="block text-slate-300 font-bold mb-1">Your Email:</label>
                    <input type="email" placeholder="you@example.com" required class="w-full bg-slate-900 border border-slate-700 focus:border-emerald-400 text-white rounded-xl px-4 py-3 focus:outline-none"/>
                </div>

                <div>
                    <label class="block text-slate-300 font-bold mb-1">Topic:</label>
                    <select class="w-full bg-slate-900 border border-slate-700 focus:border-emerald-400 text-white rounded-xl px-4 py-3 focus:outline-none">
                        <option>How to execute stock orders</option>
                        <option>StockBuddy AI advice clarification</option>
                        <option>Subscription upgrade & receipts</option>
                    </select>
                </div>

                <div>
                    <label class="block text-slate-300 font-bold mb-1">Message:</label>
                    <textarea rows="3" placeholder="Describe your question..." class="w-full bg-slate-900 border border-slate-700 focus:border-emerald-400 text-white rounded-xl px-4 py-3 focus:outline-none"></textarea>
                </div>

                <button type="submit" class="w-full py-3.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-headline font-black text-sm rounded-xl transition-all">
                    Send Support Message
                </button>
            </form>
        </div>
    </main>

    <!-- Script Injection -->
    <script src="../stock_engine.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('navbar-mount').innerHTML = StockCraft.renderNavbar('support');
        });

        function handleSupportSubmit(e) {
            e.preventDefault();
            StockCraft.ui.showToast('Ticket Received', 'Our StockBuddy AI team will respond shortly.', 'success');
        }
    </script>
</body>
</html>
