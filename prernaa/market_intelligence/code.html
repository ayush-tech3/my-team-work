<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AI Market Intelligence & Copilot — StockCraft AI</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: {
                        headline: ["Outfit", "sans-serif"],
                        body: ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-slate-950 font-body text-slate-100 min-h-screen selection:bg-emerald-500 selection:text-slate-950">

    <!-- Global Navigation -->
    <div id="navbar-mount"></div>

    <main class="pt-20 pb-20 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-10">

        <!-- Page Header -->
        <div class="text-center max-w-3xl mx-auto space-y-3">
            <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-xs font-bold uppercase tracking-wider">
                <span class="material-symbols-outlined text-sm">auto_awesome</span>
                AI Market Intelligence & Sentiment
            </div>
            <h1 class="text-4xl sm:text-5xl font-black font-headline text-white tracking-tight">
                AI Stock Analysis Engine
            </h1>
            <p class="text-slate-400 text-sm">
                Get instant institutional-grade stock evaluations translated into plain English for beginners.
            </p>
        </div>

        <!-- Interactive AI Stock Search Spotlight -->
        <div class="glass-panel p-8 rounded-3xl border-emerald-500/30 max-w-3xl mx-auto space-y-6">
            <h3 class="font-headline font-bold text-xl text-white flex items-center gap-2">
                <span class="material-symbols-outlined text-emerald-400">search</span>
                <span>Select or Search Stock for Instant AI Analysis</span>
            </h3>

            <div class="flex flex-wrap gap-2" id="stock-chips">
                <!-- Stock Ticker Quick Chips -->
            </div>

            <div id="ai-search-result" class="bg-slate-950 p-6 rounded-2xl border border-slate-800 space-y-4">
                <!-- AI Stock Evaluation Card Populated Dynamically -->
            </div>
        </div>

        <!-- AI News & Sentiment Feed -->
        <div class="space-y-6">
            <h2 class="text-2xl font-bold font-headline text-white flex items-center gap-2">
                <span class="material-symbols-outlined text-emerald-400">newspaper</span>
                <span>Live AI News & Market Sentiment Feed</span>
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="news-grid">
                <!-- Populated dynamically -->
            </div>
        </div>

    </main>

    <!-- Script Injection -->
    <script src="../stock_engine.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('navbar-mount').innerHTML = StockCraft.renderNavbar('ai');
            
            const stocks = StockCraft.getStocks();
            const chips = document.getElementById('stock-chips');

            chips.innerHTML = stocks.map(s => `
                <button onclick="analyzeStock('${s.symbol}')" class="px-3.5 py-1.5 rounded-xl bg-slate-900 hover:bg-emerald-500 hover:text-slate-950 text-slate-200 border border-slate-700 text-xs font-bold font-headline transition-all">
                    ${s.symbol}
                </button>
            `).join('');

            // Default analyze AAPL
            analyzeStock('AAPL');

            // Render News Feed
            renderNewsFeed();
        });

        function analyzeStock(symbol) {
            const stock = StockCraft.getStock(symbol);
            const state = StockCraft.getState();
            const container = document.getElementById('ai-search-result');

            container.innerHTML = `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-800 pb-4">
                    <div>
                        <div class="flex items-center gap-3">
                            <span class="text-2xl font-black font-headline text-white">${stock.symbol}</span>
                            <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                ${stock.riskLevel}
                            </span>
                        </div>
                        <h4 class="text-sm font-bold text-slate-300">${stock.name} • ${stock.sector}</h4>
                    </div>

                    <div class="text-right">
                        <div class="text-2xl font-black font-headline text-white">${state.currency}${stock.price.toFixed(2)}</div>
                        <div class="text-xs font-bold ${stock.change >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${stock.changePercent}</div>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs">
                    <div class="bg-slate-900 p-3 rounded-xl border border-slate-800">
                        <span class="text-slate-400 block mb-1">AI Recommendation</span>
                        <span class="font-bold text-emerald-400 text-sm">${stock.aiSignal}</span>
                    </div>
                    <div class="bg-slate-900 p-3 rounded-xl border border-slate-800">
                        <span class="text-slate-400 block mb-1">AI Confidence Score</span>
                        <span class="font-bold text-white text-sm">${stock.aiScore} / 100</span>
                    </div>
                    <div class="bg-slate-900 p-3 rounded-xl border border-slate-800">
                        <span class="text-slate-400 block mb-1">P/E Ratio</span>
                        <span class="font-bold text-white text-sm">${stock.pe}</span>
                    </div>
                </div>

                <div class="space-y-2 text-xs">
                    <h5 class="font-bold text-slate-200">Executive Summary:</h5>
                    <p class="text-slate-300 leading-relaxed">${stock.aiSummary}</p>
                </div>

                <div class="bg-emerald-500/10 p-4 rounded-xl border border-emerald-500/20 text-xs text-emerald-300 space-y-1">
                    <div class="font-bold flex items-center gap-1 text-emerald-400">
                        <span class="material-symbols-outlined text-sm">lightbulb</span>
                        Beginner Tip:
                    </div>
                    <p>${stock.beginnerTip}</p>
                </div>

                <a href="/prernaa/user_dashboard/code.html" class="inline-flex items-center justify-center w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-headline font-bold text-sm rounded-xl transition-all gap-1.5">
                    <span class="material-symbols-outlined">shopping_cart</span>
                    <span>Practice Purchase ${stock.symbol} Shares</span>
                </a>
            `;
        }

        function renderNewsFeed() {
            const news = [
                {
                    title: 'Federal Reserve Keeps Interest Rates Steady; Tech Stocks Rally',
                    source: 'Market Watch',
                    time: '15 mins ago',
                    sentiment: 'BULLISH (+85%)',
                    tagColor: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30',
                    summary: 'Tech indices saw buying pressure as inflation data aligned with market forecasts.'
                },
                {
                    title: 'NVIDIA Announces Next-Gen Blackwell Chip Expansion',
                    source: 'TechCrunch',
                    time: '1 hour ago',
                    sentiment: 'STRONG BULLISH (+94%)',
                    tagColor: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30',
                    summary: 'Cloud providers accelerate data center investments to meet AI demand.'
                },
                {
                    title: 'Crude Oil Prices Stabilize Amid Global Supply Adjustment',
                    source: 'Reuters',
                    time: '3 hours ago',
                    sentiment: 'NEUTRAL (50%)',
                    tagColor: 'bg-amber-500/20 text-amber-300 border-amber-500/30',
                    summary: 'Energy sector trades flat as traders weigh production quotas.'
                }
            ];

            const grid = document.getElementById('news-grid');
            grid.innerHTML = news.map(n => `
                <div class="glass-panel p-6 rounded-2xl space-y-3 flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between text-[10px] text-slate-400 mb-2">
                            <span>${n.source} • ${n.time}</span>
                            <span class="px-2 py-0.5 rounded-full font-bold border ${n.tagColor}">${n.sentiment}</span>
                        </div>
                        <h4 class="font-headline font-bold text-white text-base leading-snug mb-2">${n.title}</h4>
                        <p class="text-xs text-slate-300 leading-relaxed">${n.summary}</p>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
