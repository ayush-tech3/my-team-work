<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login & Authentication — StockCraft AI</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: {
                        headline: ["Outfit", "sans-serif"],
                        body: ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-slate-950 font-body text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Global Navigation -->
    <div id="navbar-mount"></div>

    <main class="pt-24 pb-20 max-w-md mx-auto px-4 w-full">
        <div class="glass-panel p-8 rounded-3xl border-emerald-500/30 space-y-6 shadow-2xl">
            <div class="text-center space-y-2">
                <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold mx-auto">
                    <span class="material-symbols-outlined text-2xl">lock</span>
                </div>
                <h1 class="text-3xl font-black font-headline text-white">Welcome Back</h1>
                <p class="text-xs text-slate-400">Access your practice portfolio and StockBuddy AI insights.</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4 text-xs">
                <div>
                    <label class="block text-slate-300 font-bold mb-1">Email Address:</label>
                    <input type="email" value="trader@stockcraft.ai" required class="w-full bg-slate-900 border border-slate-700 focus:border-emerald-400 text-white rounded-xl px-4 py-3 focus:outline-none"/>
                </div>

                <div>
                    <label class="block text-slate-300 font-bold mb-1">Password:</label>
                    <input type="password" value="••••••••••••" required class="w-full bg-slate-900 border border-slate-700 focus:border-emerald-400 text-white rounded-xl px-4 py-3 focus:outline-none"/>
                </div>

                <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 text-slate-950 font-headline font-black text-sm rounded-xl shadow-lg shadow-emerald-500/20 active:scale-95 transition-all">
                    Sign In to Dashboard
                </button>
            </form>
        </div>
    </main>

    <!-- Script Injection -->
    <script src="../stock_engine.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('navbar-mount').innerHTML = StockCraft.renderNavbar('login');
        });

        function handleLogin(e) {
            e.preventDefault();
            StockCraft.ui.showToast('Login Successful!', 'Welcome to StockCraft AI.', 'success');
            setTimeout(() => window.location.href = '/prernaa/user_dashboard/code.html', 1000);
        }
    </script>
</body>
</html>
