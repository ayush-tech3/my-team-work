<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Beginner Investor Onboarding — StockCraft AI</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: {
                        headline: ["Outfit", "sans-serif"],
                        body: ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-slate-950 font-body text-slate-100 min-h-screen selection:bg-emerald-500 selection:text-slate-950 flex flex-col justify-between">

    <!-- Global Navigation -->
    <div id="navbar-mount"></div>

    <main class="pt-24 pb-20 max-w-xl mx-auto px-4 w-full">
        <div class="glass-panel p-8 sm:p-10 rounded-3xl border-emerald-500/30 space-y-6 shadow-2xl">
            <div class="text-center space-y-2">
                <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold mx-auto">
                    <span class="material-symbols-outlined text-2xl">person_add</span>
                </div>
                <h1 class="text-3xl font-black font-headline text-white">Create Your Trading Profile</h1>
                <p class="text-xs text-slate-400">Tell us your investor goals to customize your $25,000 virtual starter portfolio.</p>
            </div>

            <form onsubmit="finishOnboarding(event)" class="space-y-5 text-xs">
                <div>
                    <label class="block text-slate-300 font-bold mb-1">Your Name / Trader Tag:</label>
                    <input type="text" value="New Investor" required class="w-full bg-slate-900 border border-slate-700 focus:border-emerald-400 text-white rounded-xl px-4 py-3 focus:outline-none"/>
                </div>

                <div>
                    <label class="block text-slate-300 font-bold mb-1">Select Preferred Market Region:</label>
                    <select id="onboard-currency" class="w-full bg-slate-900 border border-slate-700 focus:border-emerald-400 text-white rounded-xl px-4 py-3 focus:outline-none font-bold">
                        <option value="$">US & Global Markets (USD $)</option>
                        <option value="₹">Indian Stock Market (INR ₹)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-slate-300 font-bold mb-1">Primary Investor Goal:</label>
                    <select class="w-full bg-slate-900 border border-slate-700 focus:border-emerald-400 text-white rounded-xl px-4 py-3 focus:outline-none">
                        <option>🛡️ Safe Steady Growth (ETFs & Blue Chips)</option>
                        <option>🚀 High Tech & AI Innovation (NVDA, AAPL, MSFT)</option>
                        <option>💵 Dividend Cash Flow Investing</option>
                    </select>
                </div>

                <button type="submit" class="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 text-slate-950 font-headline font-black text-sm rounded-xl shadow-xl shadow-emerald-500/20 active:scale-95 transition-all flex items-center justify-center gap-2">
                    <span>Activate $25,000 Simulator Portfolio</span>
                    <span class="material-symbols-outlined text-base">arrow_forward</span>
                </button>
            </form>
        </div>
    </main>

    <!-- Script Injection -->
    <script src="../stock_engine.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('navbar-mount').innerHTML = StockCraft.renderNavbar('onboarding');
        });

        function finishOnboarding(e) {
            e.preventDefault();
            const curr = document.getElementById('onboard-currency').value;
            const state = StockCraft.getState();
            state.currency = curr;
            localStorage.setItem('stockcraft_state_v1', JSON.stringify(state));

            StockCraft.ui.showToast('Account Ready!', 'Your $25,000 virtual paper wallet is initialized.', 'success');
            setTimeout(() => window.location.href = '/prernaa/user_dashboard/code.html', 1200);
        }
    </script>
</body>
</html>
