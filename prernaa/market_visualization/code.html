<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Interactive Chart Visualizer — StockCraft AI</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: {
                        headline: ["Outfit", "sans-serif"],
                        body: ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-slate-950 font-body text-slate-100 min-h-screen selection:bg-emerald-500 selection:text-slate-950">

    <!-- Global Navigation -->
    <div id="navbar-mount"></div>

    <main class="pt-20 pb-20 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8">

        <!-- Page Header -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="text-3xl sm:text-4xl font-black font-headline text-white tracking-tight flex items-center gap-3">
                    <span class="material-symbols-outlined text-emerald-400 text-3xl">show_chart</span>
                    <span>Interactive Market Chart Studio</span>
                </h1>
                <p class="text-slate-400 text-xs mt-1">Visualize 1H, 1D, 30D, and 1Y price movements, SMA moving averages, and AI trend forecasts for any stock asset.</p>
            </div>

            <!-- Asset Selector & Control Buttons -->
            <div class="flex items-center gap-3">
                <select id="chart-asset-select" onchange="renderStudioChart(this.value)" class="bg-slate-900 border border-slate-700 font-headline font-bold text-sm text-white rounded-xl px-4 py-2 focus:border-emerald-400 focus:outline-none">
                    <!-- Populated dynamically -->
                </select>
                <a href="/prernaa/user_dashboard/code.html" class="px-4 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-headline font-bold text-xs rounded-xl shadow-lg transition-all flex items-center gap-1">
                    <span class="material-symbols-outlined text-base">shopping_cart</span>
                    <span>Practice Purchase</span>
                </a>
            </div>
        </div>

        <!-- Main Chart Studio Container -->
        <div class="glass-panel p-6 rounded-3xl space-y-6">
            <!-- Studio Toolbar -->
            <div class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-4">
                <!-- Working Timeframe Switcher -->
                <div class="flex gap-1.5 bg-slate-900 p-1.5 rounded-xl border border-slate-800 text-xs font-bold">
                    <button id="st-btn-1H" onclick="setStudioTimeframe('1H')" class="px-3.5 py-1.5 rounded-lg bg-emerald-500 text-slate-950 font-extrabold shadow transition-all">
                        1H Ticks
                    </button>
                    <button id="st-btn-1D" onclick="setStudioTimeframe('1D')" class="px-3.5 py-1.5 rounded-lg text-slate-400 hover:text-white transition-all">
                        1D (Daily)
                    </button>
                    <button id="st-btn-30D" onclick="setStudioTimeframe('30D')" class="px-3.5 py-1.5 rounded-lg text-slate-400 hover:text-white transition-all">
                        30D (Monthly)
                    </button>
                    <button id="st-btn-1Y" onclick="setStudioTimeframe('1Y')" class="px-3.5 py-1.5 rounded-lg text-slate-400 hover:text-white transition-all">
                        1Y (Yearly)
                    </button>
                </div>

                <!-- Indicator Toggles -->
                <div class="flex items-center gap-4 text-xs font-bold">
                    <label class="flex items-center gap-2 text-slate-300 cursor-pointer">
                        <input type="checkbox" id="toggle-sma" checked onchange="toggleIndicator('sma')" class="rounded border-slate-700 text-amber-500 focus:ring-0"/>
                        <span>SMA Moving Avg</span>
                    </label>
                    <label class="flex items-center gap-2 text-slate-300 cursor-pointer">
                        <input type="checkbox" id="toggle-ai" checked onchange="toggleIndicator('ai')" class="rounded border-slate-700 text-cyan-500 focus:ring-0"/>
                        <span>AI Forecast Overlay</span>
                    </label>
                </div>
            </div>

            <!-- Canvas -->
            <div class="relative w-full h-[450px]">
                <canvas id="studioCanvas"></canvas>
            </div>
        </div>

    </main>

    <!-- Script Injection -->
    <script src="../stock_engine.js"></script>
    <script>
        let studioChart = null;
        let activeSymbol = 'NVDA';
        let activeStudioTimeframe = '1H';

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('navbar-mount').innerHTML = StockCraft.renderNavbar('charts');
            
            const stocks = StockCraft.getStocks();
            const select = document.getElementById('chart-asset-select');
            select.innerHTML = stocks.map(s => `<option value="${s.symbol}">${s.symbol} — ${s.name} (${s.trendType})</option>`).join('');
            select.value = activeSymbol;

            renderStudioChart(activeSymbol);

            // REAL-TIME TICK LISTENER IN CHART STUDIO
            window.addEventListener('stockcraft_tick', (e) => {
                const tick = e.detail;
                if (tick.symbol === activeSymbol && studioChart && activeStudioTimeframe === '1H') {
                    studioChart.data.datasets[0].data[studioChart.data.datasets[0].data.length - 1] = tick.price;
                    studioChart.update('none');
                }
            });
        });

        function setStudioTimeframe(tf) {
            activeStudioTimeframe = tf;
            ['1H', '1D', '30D', '1Y'].forEach(t => {
                const btn = document.getElementById(`st-btn-${t}`);
                if (btn) {
                    btn.className = t === tf 
                        ? 'px-3.5 py-1.5 rounded-lg bg-emerald-500 text-slate-950 font-extrabold shadow transition-all'
                        : 'px-3.5 py-1.5 rounded-lg text-slate-400 hover:text-white transition-all';
                }
            });
            renderStudioChart(activeSymbol);
        }

        function renderStudioChart(symbol) {
            activeSymbol = symbol;
            const stock = StockCraft.getStock(symbol);
            const ctx = document.getElementById('studioCanvas').getContext('2d');

            if (studioChart) studioChart.destroy();

            let labels = stock.hourlyLabels;
            let data = stock.hourlyData;

            if (activeStudioTimeframe === '1D') {
                labels = stock.dailyLabels;
                data = stock.dailyData;
            } else if (activeStudioTimeframe === '30D') {
                labels = stock.monthlyLabels;
                data = stock.monthlyData;
            } else if (activeStudioTimeframe === '1Y') {
                labels = stock.yearlyLabels;
                data = stock.yearlyData;
            }

            const smaData = data.map((v, i) => v * (1 - (0.01 * (i % 3))));
            const halfIdx = Math.floor(data.length / 2);
            const aiData = data.map((v, i) => i >= halfIdx ? (stock.trendType === 'INCREASING' ? v * 1.03 : v * 0.97) : null);

            studioChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: `${stock.symbol} Price`,
                            data: data,
                            borderColor: stock.trendType === 'INCREASING' ? '#10b981' : '#f43f5e',
                            backgroundColor: stock.trendType === 'INCREASING' ? 'rgba(16, 185, 129, 0.1)' : 'rgba(244, 63, 94, 0.1)',
                            fill: true,
                            tension: 0.3,
                            borderWidth: 3
                        },
                        {
                            label: 'SMA-20 Indicator',
                            data: smaData,
                            borderColor: '#eab308',
                            borderWidth: 2,
                            pointRadius: 0,
                            fill: false
                        },
                        {
                            label: 'AI Forecast Overlay',
                            data: aiData,
                            borderColor: '#06b6d4',
                            borderDash: [6, 6],
                            borderWidth: 2,
                            fill: false
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } },
                        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } }
                    }
                }
            });
        }

        function toggleIndicator(type) {
            if (!studioChart) return;
            if (type === 'sma') {
                studioChart.data.datasets[1].hidden = !document.getElementById('toggle-sma').checked;
            } else if (type === 'ai') {
                studioChart.data.datasets[2].hidden = !document.getElementById('toggle-ai').checked;
            }
            studioChart.update();
        }
    </script>
</body>
</html>
